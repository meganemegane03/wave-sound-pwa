<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">


<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">



<title>波の音</title>



<!-- PWA -->

<link rel="manifest"
href="/wave-sound-pwa/manifest.json">



<meta name="theme-color"
content="#5b4636">



<!-- iPhoneホーム画面対応 -->

<meta name="apple-mobile-web-app-capable"
content="yes">


<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">


<meta name="apple-mobile-web-app-title"
content="波の音">



<link rel="apple-touch-icon"
href="/wave-sound-pwa/icon.png">





<!-- CSS -->

<link rel="stylesheet"
href="/wave-sound-pwa/style.css">


</head>




<body>


<div id="app">





<!-- 起動画面 -->


<div id="startScreen">


<div class="titleBox">


<h1>
波の音
</h1>


<p>
木箱を傾けて<br>
海の音を感じてください
</p>


<button id="startButton">

開始

</button>


</div>


</div>







<!-- メイン -->

<main id="mainScreen">



<div id="woodBox">



<img

id="boxImage"

src="/wave-sound-pwa/wood-box.PNG"

alt="波の音 木箱">


<div id="beansArea"></div>



</div>




<div id="message">

ゆっくり傾けてください

</div>



</main>





</div>






<!-- 波音 -->

<audio

id="waveSound"

src="/wave-sound-pwa/sounds/wave.mp3"

loop>

</audio>








<!-- JS -->

<script src="/wave-sound-pwa/script.js"></script>





<!-- Service Worker -->

<script>


if(
"serviceWorker" in navigator
){


window.addEventListener(
"load",

()=>{


navigator.serviceWorker.register(

"/wave-sound-pwa/service-worker.js"

);


}

);


}



</script>




</body>

</html>
